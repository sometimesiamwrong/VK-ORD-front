# Используем легковесный образ Alpine Linux
image: alpine:latest

stages:
  - build
  - deploy

# Этап сборки остается БЕЗ ИЗМЕНЕНИЙ, но мы его переписываем для ясности
# Он будет выполняться в образе Node.js
build_frontend:
  stage: build
  image: node:20-alpine # Используем Node.js только для сборки
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/

# Этап развертывания теперь использует FTP
deploy_to_hosting:
  stage: deploy
  # На этом этапе нам не нужен Node.js, только утилита для FTP
  before_script:
    # Устанавливаем lftp - мощный клиент для FTP
    - apk add --no-cache lftp
  script:
    - echo "Deploying application via FTP to /www/ad-lawyer.ru/..."
    # Основная команда для деплоя
    - lftp -e "set ftp:ssl-allow no; open -u $FTP_USER,$FTP_PASSWORD $FTP_HOST; mirror --delete --verbose --parallel=10 -R dist/ /www/ad-lawyer.ru/; quit"
  only:
    - main