# 1. Выбираем официальный образ Node.js. Укажите версию, которую вы используете.
image: node:20-alpine

# 2. Определяем этапы пайплайна: сборка и развертывание
stages:
  - build
  - deploy

# 3. Этап сборки приложения
build_frontend:
  stage: build
  script:
    # Устанавливаем зависимости из package-lock.json для стабильности
    - npm ci
    # Собираем проект. В результате должна появиться папка 'dist'
    - npm run build
  # 4. Сохраняем собранную папку 'dist' для следующего этапа
  artifacts:
    paths:
      - dist/

deploy_to_hosting:
  stage: deploy
  before_script:
    - 'apk add --no-cache openssh-client'
    - 'eval $(ssh-agent -s)'
    - 'echo "$SSH_PRIVATE_KEY" | tr -d "\r" | ssh-add -'
    - 'mkdir -p ~/.ssh'
    - 'chmod 700 ~/.ssh'
    # Используем $SSH_HOST, который теперь является IP-адресом
    - 'ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts'
    - 'chmod 644 ~/.ssh/known_hosts'
  script:
    - 'echo "Deploying application to /www/ad-lawyer.ru/..."'
    - 'ping $SSH_HOST -c 1'
    # Поскольку порт 22, опция -P не нужна
    - 'ssh -vvv $SSH_USER@$SSH_HOST "echo hyu! && exit"'
    - 'scp -r dist/* $SSH_USER@$SSH_HOST:/www/ad-lawyer.ru/'
    - 'echo "Application successfully deployed!"'
  only:
    - main